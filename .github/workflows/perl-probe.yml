name: Perl probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner perl facts
        run: |
          echo "== which -a perl"; which -a perl || true
          echo "== version"; perl -V:version || true
          echo "== thread/flags"; perl -V:usethreads || true
          echo "== Cwd load"; perl -MCwd -e 'print "Cwd OK\n"' || true
          echo "== @INC"; perl -e 'print "$_\n" for @INC' || true
          echo "== Cwd.so on disk"; find / -name 'Cwd.so' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -10
          echo "== perl binaries on disk"; find / -type f -name perl -perm -u+x -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -10
          echo "== perl env"; env | grep -i perl || echo "(none)"
